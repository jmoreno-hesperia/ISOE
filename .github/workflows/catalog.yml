name: Actualizar catálogo x64
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps.json', 'scripts/**', '.github/workflows/catalog.yml']
permissions:
  contents: write
concurrency:
  group: isoe-catalog
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/catalog.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Guardar catálogo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json catalog-v2.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar catálogo x64 desde WinGet'
            git push
          fi
