name: Tramitar solicitud de software
on:
  issues:
    types: [opened, labeled]
permissions:
  contents: write
  issues: write
concurrency:
  group: isoe-catalog
  cancel-in-progress: false
jobs:
  add:
    if: >-
      github.event.label.name == 'new-app' ||
      (github.event.action == 'opened' && contains(github.event.issue.body, '### ID de WinGet') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar permiso del revisor
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.repos.getCollaboratorPermissionLevel({...context.repo, username: context.actor});
            if (!['admin', 'maintain', 'write'].includes(data.permission)) core.setFailed('Se requiere un mantenedor con permiso de escritura.');
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/add_app.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: python scripts/catalog.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Guardar software y catálogo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps.json catalog.json
          git commit -m 'Añadir software aprobado a ISOE'
          git push
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body: 'Software validado y añadido al catálogo ISOE (x64).'});
            await github.rest.issues.update({...context.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed'});
      - if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body: 'No se pudo añadir el software. Revisa el ID, los duplicados y la disponibilidad de un instalador x64 silencioso compatible. Detalles: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId});
