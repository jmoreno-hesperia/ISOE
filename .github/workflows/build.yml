name: Compilar ISOE para Windows
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['src/**', 'scripts/build.ps1', '.github/workflows/build.yml', 'tests/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar catálogo y formularios
        run: |
          pip install -r scripts/requirements.txt
          python -m unittest discover -s tests -v
      - name: Compilar
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Validar cliente sin instalar software
        shell: pwsh
        run: |
          $test = Start-Process ./dist/ISOE.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw 'Validación del cliente fallida' }
      - uses: actions/upload-artifact@v4
        with:
          name: ISOE-windows-x64
          path: |
            dist/ISOE.exe
            dist/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ISOE-windows-x64
          path: dist
      - name: Publicar descarga
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --title "ISOE $RELEASE_TAG" --generate-notes
